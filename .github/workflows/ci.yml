name: CI

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.11.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
        env:
          DRIZZLE_DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SKIP_ENV_VALIDATION: "1"
          TYPESENSE_API_KEY: "dummy"
          TYPESENSE_HOST: "localhost"
          TYPESENSE_PORT: "8108"
          TYPESENSE_PROTOCOL: "http"
