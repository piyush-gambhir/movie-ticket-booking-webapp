packages:
  - "."
allowBuilds:
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@next/env@16.4.3"
  - "@next/eslint-plugin-next@16.4.3"
  - "@next/swc-darwin-arm64@16.4.3"
  - "@next/swc-darwin-x64@16.4.3"
  - "@next/swc-linux-arm64-gnu@16.4.3"
  - "@next/swc-linux-arm64-musl@16.4.3"
  - "@next/swc-linux-x64-gnu@16.4.3"
  - "@next/swc-linux-x64-musl@16.4.3"
  - "@next/swc-win32-arm64-msvc@16.4.3"
  - "@next/swc-win32-x64-msvc@16.4.3"
  - eslint-config-next@16.4.3
  - next@16.4.3
  - "@next/bundle-analyzer@16.4.3"

overrides:
  # Keep affected releases on the locally patched artifact until upstream releases a fix.
  "deepmerge@>=4.2.0 <=4.3.1": 4.3.1
  # Drizzle Kit 0.31.11 bundles tsx and never imports the old loader.
  # test:drizzle-security verifies the exact CLI and offline SQL generation.
  "drizzle-kit@0.31.11>@esbuild-kit/esm-loader": "-"
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch

# The required regression job verifies the locked local patch before this audit exception.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
